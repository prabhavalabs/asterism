global
    log /dev/log local0
    stats socket /run/haproxy/admin.sock mode 660 level admin
    # ssl-default-bind-ciphers ...

defaults
    mode http
    timeout connect 5s

userlist admins
    user admin password $6$s3cr3t-value

frontend https_in
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/site.pem alpn h2,http/1.1
    acl host_shop hdr(host) -i shop.example.com www.shop.example.com
    acl host_api  hdr_dom(host) -i api.example.com
    acl is_static path_beg /static
    use_backend be_shop if host_shop
    use_backend be_api if host_api !is_static
    default_backend be_default

backend be_shop
    balance leastconn
    option httpchk GET /healthz
    server shop1 127.0.0.1:3001 check weight 10
    server shop2 127.0.0.1:3002 check weight 5
    server shop3 10.0.0.9:3001 check backup

backend be_api
    server api1 127.0.0.1:4000 check

backend be_default
    server fallback 127.0.0.1:8080

backend be_unused

listen postgres 0.0.0.0:5433
    mode tcp
    server pg1 127.0.0.1:5432 check
