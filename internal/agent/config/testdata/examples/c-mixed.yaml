# Example (c): mixed, with Caddy and cloudflared
hub: {url: https://asterism.tailnet.example.ts.net, token_file: /etc/asterism/agent.token,
      tls: {pin_sha256: ["/HGJZsEB2BqPxAXFaS5wieyk9zmV2qq7Yn2opHrncf8="]}}
host: {name: edge-2}
sources:
  docker: {endpoint: tcp://socket-proxy:2375}
  systemd: {include: [caddy.service, cloudflared.service]}
  proxies:
    caddy: {admin_api: "http://127.0.0.1:2019"}
    cloudflared: {config: /etc/cloudflared/config.yml}
  routes:                                   # a token-managed tunnel has no local ingress file
    - {proxy: cloudflared, hostnames: [status.example.com], upstream: "http://127.0.0.1:3001"}
projects:
  - {name: edge, category: infra, icon: cloudflare, members: {units: [caddy.service, cloudflared.service]}}
