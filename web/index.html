<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Asterism · VPS observatory</title>
    <meta name="description" content="Self-hosted VPS observatory: projects, containers, ports and traffic, live on one map." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07080b" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Asterism" />

    <!-- Link previews. The server swaps __ASTERISM_ORIGIN__ for server.public_url. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Asterism" />
    <meta property="og:title" content="Asterism · VPS observatory" />
    <meta property="og:description" content="Projects, containers, ports and traffic, live on one map. Self-hosted and open source." />
    <meta property="og:url" content="__ASTERISM_ORIGIN__/" />
    <meta property="og:image" content="__ASTERISM_ORIGIN__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Asterism logo and wordmark: self-hosted VPS observatory." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Asterism · VPS observatory" />
    <meta name="twitter:description" content="Projects, containers, ports and traffic, live on one map. Self-hosted and open source." />
    <meta name="twitter:image" content="__ASTERISM_ORIGIN__/og-image.png" />
    <meta name="twitter:image:alt" content="The Asterism logo and wordmark: self-hosted VPS observatory." />
    <script>
      (function () {
        try {
          var p = localStorage.getItem("asterism-theme");
          var d =
            p === "dark" ||
            (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.classList.toggle("dark", d);
          r.style.colorScheme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
