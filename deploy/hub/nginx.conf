# nginx site for an Asterism hub at monitor.example.com.
# /etc/nginx/sites-available/asterism, then symlink into sites-enabled.
#
# The hub listens on 127.0.0.1:7700. Live views use long-lived Connect
# streams, so responses are not buffered and reads may idle for an hour.
# Issue the certificate with the webroot below:
#   certbot certonly --webroot -w /var/www/asterism-acme -d monitor.example.com

upstream asterism_hub {
    server 127.0.0.1:7700;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/asterism-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1 prefers "listen 443 ssl;" plus "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:asterism_tls:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Behind Cloudflare: include its ranges as set_real_ip_from lines.
    # include /etc/nginx/asterism/cloudflare-ips.conf;
    # real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/asterism-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://asterism_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_connect_timeout 5s;
    }
}
